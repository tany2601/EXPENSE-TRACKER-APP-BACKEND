name: Deploy Rupexo API Staging

on:
  push:
    branches:
      - rupexo-dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Staging API
        uses: appleboy/ssh-action@v0.1.10

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            cd /var/www/paperlighttech/rupexo-api-staging

            git fetch origin
            git reset --hard origin/rupexo-dev

            npm install
            npm run build

            pm2 restart rupexo-api-staging || pm2 start dist/main.js --name rupexo-api-staging